<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
  <title id="title">z486 source organization on the i486 block diagram</title>
  <desc id="desc">A redrawing of US 5,134,693 Fig. 1, the i486 "microprocessor 60": bus interface unit, cache, prefetcher, instruction decoder, control, paging, segmentation, datapath and floating-point units joined by the XA, XD, KBRD, K1Q, K2Q, PA, LA, M, R and I buses. Each unit lists the z486 source files that implement it.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>.box{stroke-width:2;rx:7}.h{font:600 17px system-ui,sans-serif;fill:#0f172a}.n{font:13px system-ui,sans-serif;fill:#94a3b8}.f{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}.b{font:600 13px system-ui,sans-serif;fill:#475569}.s{font:12px system-ui,sans-serif;fill:#64748b}.wire{stroke:#475569;stroke-width:2;fill:none}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.both{stroke:#475569;stroke-width:2;fill:none;marker-start:url(#a);marker-end:url(#a)}.uop{stroke:#7c3aed;stroke-width:5;fill:none}.uarrow{stroke:#7c3aed;stroke-width:2;fill:none;marker-end:url(#a)}.dot{fill:#475569}</style>
  </defs>
  <rect width="1200" height="990" fill="#fff"/>
  <text x="600" y="30" text-anchor="middle" class="h">z486 sources on the i486 block diagram (US 5,134,693, Fig. 1)</text>

  <!-- External buses -->
  <path d="M360 52V86" class="both"/><text x="372" y="70" class="b">XA bus</text>
  <path d="M900 52V86" class="both"/><text x="912" y="70" class="b">XD bus</text>

  <!-- Bus interface unit -->
  <rect x="220" y="90" width="880" height="64" class="box" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="660" y="116" text-anchor="middle" class="h">Bus interface unit <tspan class="n">62</tspan></text>
  <text x="660" y="140" text-anchor="middle" class="f">memory.sv  bus_unit.sv</text>

  <!-- BIU <-> cache / prefetcher -->
  <path d="M300 158V206" class="both"/><text x="312" y="186" class="b">Address bus</text>
  <path d="M500 210V158" class="arrow"/><text x="512" y="186" class="b">Data bus</text>
  <path d="M1000 154V206" class="arrow"/><text x="1012" y="186" class="b">KBRD bus</text>

  <!-- Cache and prefetcher (one K unit) -->
  <rect x="220" y="210" width="420" height="84" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="430" y="236" text-anchor="middle" class="h">Cache <tspan class="n">66</tspan></text>
  <text x="430" y="259" text-anchor="middle" class="f">cache_unit.sv  data_access.sv</text>
  <text x="430" y="279" text-anchor="middle" class="f">l1_cache.sv  l1_icache.sv</text>
  <rect x="640" y="210" width="460" height="84" class="box" fill="#cffafe" stroke="#0891b2"/>
  <text x="870" y="242" text-anchor="middle" class="h">Prefetcher <tspan class="n">64</tspan></text>
  <text x="870" y="268" text-anchor="middle" class="f">prefetch.sv</text>

  <!-- Paging -->
  <rect x="220" y="370" width="340" height="76" class="box" fill="#ecfeff" stroke="#0e7490"/>
  <text x="390" y="396" text-anchor="middle" class="h">Paging unit <tspan class="n">72</tspan></text>
  <text x="390" y="418" text-anchor="middle" class="f">paging_unit.sv</text>
  <text x="390" y="436" text-anchor="middle" class="f">paging_tlb.sv  paging_walker.sv</text>
  <path d="M480 370V298" class="arrow"/><text x="492" y="338" class="b">PA bus</text>

  <!-- Instruction decoder -->
  <path d="M1000 294V366" class="arrow"/><text x="1012" y="326" class="b">K1Q bus</text><text x="1012" y="343" class="s">macroinstruction</text>
  <rect x="760" y="370" width="390" height="76" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="955" y="396" text-anchor="middle" class="h">Instruction decode unit <tspan class="n">68</tspan></text>
  <text x="955" y="418" text-anchor="middle" class="f">decoder.sv</text>
  <text x="955" y="436" text-anchor="middle" class="f">pla_entry.svh  pla_control.svh</text>

  <!-- Decoder -> control -->
  <path d="M850 446V516" class="arrow"/><text x="862" y="486" class="b">IWORD bus</text>
  <path d="M1080 446V516" class="arrow"/><text x="990" y="486" class="b">Entry point</text>

  <!-- Control -->
  <rect x="760" y="520" width="390" height="400" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="955" y="548" text-anchor="middle" class="h">Control <tspan class="n">70</tspan></text>
  <rect x="785" y="564" width="340" height="100" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="955" y="590" text-anchor="middle" class="h">Control ROM <tspan class="n">92</tspan></text>
  <text x="955" y="614" text-anchor="middle" class="f">microsequencer.sv</text>
  <text x="955" y="634" text-anchor="middle" class="f">ucode_rom.sv  ucode_recipes.svh</text>
  <text x="955" y="654" text-anchor="middle" class="s">original 80386 microcode</text>
  <rect x="785" y="680" width="340" height="96" class="box" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="955" y="706" text-anchor="middle" class="h">Hardwired control</text>
  <text x="955" y="730" text-anchor="middle" class="f">hardwired_control.sv</text>
  <text x="955" y="752" text-anchor="middle" class="s">decoder-supplied first micro-steps (US 5,293,592)</text>
  <rect x="785" y="792" width="340" height="110" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="955" y="818" text-anchor="middle" class="h">Test logic (exception handler)</text>
  <text x="955" y="842" text-anchor="middle" class="f">protection.sv  event_control.sv</text>
  <text x="955" y="862" text-anchor="middle" class="f">interrupt_controller.sv</text>
  <text x="955" y="884" text-anchor="middle" class="s">protection test PLA, faults, interrupts</text>

  <!-- Segmentation -->
  <path d="M700 294V556H566" class="arrow"/><text x="712" y="430" class="b">K2Q bus</text>
  <rect x="220" y="520" width="340" height="76" class="box" fill="#f1f5f9" stroke="#475569"/>
  <text x="390" y="546" text-anchor="middle" class="h">Segmentation unit <tspan class="n">74</tspan></text>
  <text x="390" y="568" text-anchor="middle" class="f">segmentation_unit.sv</text>
  <text x="390" y="586" text-anchor="middle" class="f">address_unit.sv</text>

  <!-- Datapath -->
  <rect x="220" y="680" width="340" height="76" class="box" fill="#f1f5f9" stroke="#475569"/>
  <text x="390" y="706" text-anchor="middle" class="h">Data path unit <tspan class="n">76</tspan></text>
  <text x="390" y="728" text-anchor="middle" class="f">data_unit.sv  alu.sv  shifter.sv</text>
  <text x="390" y="746" text-anchor="middle" class="f">mul_div.sv  dsp_mul.sv</text>
  <path d="M390 680V600" class="arrow"/><text x="402" y="645" class="b">I bus</text>

  <!-- FPU -->
  <rect x="220" y="840" width="340" height="80" class="box" fill="#fae8ff" stroke="#a21caf"/>
  <text x="390" y="866" text-anchor="middle" class="h">Floating point unit <tspan class="n">78</tspan></text>
  <text x="390" y="888" text-anchor="middle" class="f">x87/x87_unit.sv  x87_control.sv</text>
  <text x="390" y="906" text-anchor="middle" class="f">x87_executor.sv  x87_*.sv</text>

  <!-- Microinstruction bus: control -> segmentation, datapath, FPU -->
  <path d="M760 740H610M610 578V880" class="uop"/>
  <path d="M610 578H566" class="uarrow"/>
  <path d="M610 735H566" class="uarrow"/>
  <path d="M610 880H566" class="uarrow"/>
  <text x="628" y="770" class="b" fill="#7c3aed" style="fill:#7c3aed">Micro-</text>
  <text x="628" y="786" class="b" style="fill:#7c3aed">instruction</text>

  <!-- LA bus: segmentation (or prefetcher) -> paging and cache -->
  <path d="M220 548H180V264" class="wire"/>
  <path d="M180 264H214" class="arrow"/>
  <path d="M180 408H214" class="arrow"/>
  <circle cx="180" cy="408" r="4" class="dot"/>
  <text x="188" y="480" class="b" transform="rotate(-90 188 480)">LA bus</text>

  <!-- M bus: cache <-> segmentation, datapath, FPU -->
  <path d="M130 238V860" class="wire"/>
  <path d="M130 238H214" class="arrow"/>
  <path d="M130 574H214" class="arrow"/><circle cx="130" cy="574" r="4" class="dot"/>
  <path d="M130 702H214" class="arrow"/><circle cx="130" cy="702" r="4" class="dot"/>
  <path d="M130 860H214" class="arrow"/>
  <text x="138" y="660" class="b" transform="rotate(-90 138 660)">M bus</text>

  <!-- R bus: cache -> datapath, FPU -->
  <path d="M220 222H80V898H214" class="arrow"/>
  <path d="M80 740H214" class="arrow"/><circle cx="80" cy="740" r="4" class="dot"/>
  <text x="88" y="500" class="b" transform="rotate(-90 88 500)">R bus</text>

  <text x="600" y="965" text-anchor="middle" class="s">Unit numbers follow the patent. z486.sv instantiates and connects every unit.</text>
</svg>
